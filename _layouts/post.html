
---
layout: default
---

{{ content }}

<nav class="comic-pagination">

  <div class="comic-nav-left">
    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}">
        ← Previous
      </a>
    {% endif %}
  </div>

  <div class="comic-nav-centre">
    <a id="random-comic" href="#">
      Random
    </a>
  </div>

  <div class="comic-nav-right">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}">
        Next →
      </a>
    {% endif %}
  </div>

</nav>

<script>
(function() {
  const comics = [
    {% for post in site.posts %}
      {{ post.url | relative_url | jsonify }}{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  const currentComic = {{ page.url | relative_url | jsonify }};
  const alternatives = comics.filter(url => url !== currentComic);
  const randomLink = document.getElementById('random-comic');

  if (alternatives.length > 0) {
    const randomIndex = Math.floor(Math.random() * alternatives.length);
    randomLink.href = alternatives[randomIndex];
  } else {
    randomLink.style.display = 'none';
  }
})();
</script>

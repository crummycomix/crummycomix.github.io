
name: Resize Existing Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resize-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Resize and compress images
        run: python .github/scripts/resize_images.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/

          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Resize and compress existing comic images"
            git push
          fi
